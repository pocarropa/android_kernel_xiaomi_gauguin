name: Build Gauguin Kernel (LOS 23.2 compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev \
            libelf-dev dwarves device-tree-compiler python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            cpio rsync wget xz-utils zip

      - name: Download Clang prebuilt (r547379)
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          mkdir -p clang-r547379
          tar -xzf clang.tar.gz -C clang-r547379
          rm clang.tar.gz

      - name: Download GCC prebuilt (4.9)
        run: |
          cd $HOME/toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-prebuilt

      - name: Configure kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export CLANG_DIR=$HOME/toolchain/clang-r547379
          export PATH=$CLANG_DIR/bin:$HOME/toolchain/gcc-prebuilt/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-

          mkdir -p out
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/lito-perf_defconfig \
            arch/arm64/configs/vendor/xiaomi/gauguin.config
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export CLANG_DIR=$HOME/toolchain/clang-r547379
          export PATH=$CLANG_DIR/bin:$HOME/toolchain/gcc-prebuilt/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # Compatible con LOS 23.2: Image (sin comprimir) + dtbo.img separado
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error=undef" \
            Image dtbo.img 2>&1 | tee build.log

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3

          cat > anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Gauguin Kernel (LineageOS based)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gauguin
          device.name2=gauguinpro
          device.name3=gauguininpro
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # shell variables (basado en Talesweaver que flashea sin error)
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;

          ## AnyKernel file attributes
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;

          ## AnyKernel install
          dump_boot;
          write_boot;
          ## end install

          ## dtbo (separado, como en LOS 23.2)
          if [ -f $home/dtbo.img ]; then
            flash_dtbo;
          fi
          EOF

          rm -rf .git README.md LICENSE

      - name: Package AnyKernel3 zip
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            echo "Image incluido ($(du -h out/arch/arm64/boot/Image | cut -f1))"
          else
            echo "ERROR: No se encontró Image"
            ls -la out/arch/arm64/boot/
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
            echo "dtbo.img incluido"
          else
            echo "No se generó dtbo.img (se omite)"
          fi

          cd AnyKernel3
          zip -r9 ../Gauguin-Kernel-LOS23.2-$(date +%Y%m%d-%H%M).zip * -x "*.git*" "*README*" "*LICENSE*"
          cd ..
          ls -lh Gauguin-Kernel-LOS23.2-*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload kernel image (raw)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Gauguin-Kernel-AnyKernel3
          path: Gauguin-Kernel-LOS23.2-*.zip
