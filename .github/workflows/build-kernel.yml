name: Build gauguin kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120          # evita que se cuelgue indefinidamente

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev \
            libelf-dev dwarves device-tree-compiler python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            cpio rsync wget xz-utils

      - name: Download Clang prebuilt (r547379)
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          mkdir -p clang-r547379
          tar -xzf clang.tar.gz -C clang-r547379
          rm clang.tar.gz
          # Verificar que existe el binario
          ls -la clang-r547379/bin/clang
          ls -la clang-r547379/bin/ld.lld || true

      - name: Download GCC prebuilt (4.9)
        run: |
          cd $HOME/toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-prebuilt

      - name: Configure kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export CLANG_DIR=$HOME/toolchain/clang-r547379
          export PATH=$CLANG_DIR/bin:$HOME/toolchain/gcc-prebuilt/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-

          mkdir -p out
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/bengal-perf_defconfig \
            arch/arm64/configs/vendor/xiaomi/gauguin.config

          # Desactivar el driver conflictivo nt36xxx (dejamos nt36672c)
          ./scripts/config --file out/.config -d TOUCHSCREEN_NT36XXX
          ./scripts/config --file out/.config -d TOUCHSCREEN_NT36XXX_SPI 2>/dev/null || true

          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export CLANG_DIR=$HOME/toolchain/clang-r547379
          export PATH=$CLANG_DIR/bin:$HOME/toolchain/gcc-prebuilt/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error=undef" \
            Image.gz-dtb 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gauguin
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn
